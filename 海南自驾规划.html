  if (!active) {
    det.innerHTML = `<div class="empty-hint">还没有行程日，点上方「＋天」开始编排。</div>`;
  } else {
    det.appendChild(Panel.buildDayCard(active));
  }
};

Panel.buildDayCard = function (day) {
  const p = currentPlan();
  const di = p.days.indexOf(day);
  const color = DAY_COLORS[di % DAY_COLORS.length];
  const card = document.createElement('div');
  card.className = 'day-card';

  const stopsHtml = day.stops.map((s, i) => {
    const t = STOP_TYPES[s.type] || STOP_TYPES.other;
    const globalNum = p.days.slice(0, di).reduce((acc, dd) => acc + dd.stops.length, 0) + i + 1;
    const tags = (s.note.tags || []).map(x => `<span class="mini-tag">${esc(x)}</span>`).join('');
    const snip = s.note.text ? `<div class="card-snip">${esc(s.note.text.slice(0, 60))}${s.note.text.length > 60 ? '…' : ''}</div>` : '';
    const extras = [];
    if ((s.note.links || []).length) extras.push(`🔗${s.note.links.length}`);
    if ((s.note.images || []).length) extras.push(`📷${s.note.images.length}`);
    let legHtml = '';
    if (i > 0 && day.stops[i - 1]) {
      const info = legInfo(s, day.stops[i - 1], App.settings.speed);
      const modeBadge = { draft: '<span class="leg-badge draft">草稿</span>', manual: '<span class="leg-badge manual">手绘</span>', amap: '<span class="leg-badge amap">高德✓</span>' }[info.mode];
      const legNote = s.leg && s.leg.note && (s.leg.note.text || (s.leg.note.tags || []).length)
        ? `<div class="leg-note">${(s.leg.note.tags || []).map(x => `<span class="mini-tag warn">${esc(x)}</span>`).join('')}${s.leg.note.text ? esc(s.leg.note.text.slice(0, 50)) + (s.leg.note.text.length > 50 ? '…' : '') : ''}</div>` : '';
      legHtml = `<div class="leg-strip" data-day="${day.id}" data-stop="${s.id}">
        <span class="leg-line"></span>
        <span class="leg-info">↓ ${info.distKm.toFixed(1)} km · ~${Math.round(info.durMin)}′ ${modeBadge}</span>
        <span class="leg-btns">
          <button class="ibtn" data-act="leg-route" title="高德算路（真实距离/耗时）" data-day="${day.id}" data-stop="${s.id}">⚡</button>
          <button class="ibtn" data-act="leg-draw" title="沿路手绘" data-day="${day.id}" data-stop="${s.id}">🖋️</button>
          <button class="ibtn" data-act="leg-note" title="路线贴士" data-day="${day.id}" data-stop="${s.id}">✏️</button>
        </span>${legNote}</div>`;
    }
    return `${legHtml}<div class="stop-card" draggable="true" data-day="${day.id}" data-stop="${s.id}">
      <span class="stop-num" style="--c:${color}">${globalNum}</span>
      <div class="stop-main">
        <div class="stop-name">${t.emoji} ${esc(s.name)}${s.time ? `<span class="stop-time">⏰ ${esc(s.time)}</span>` : ''}</div>
        ${tags ? `<div class="stop-tags">${tags}${extras.length ? `<span class="stop-extras">${extras.join(' · ')}</span>` : ''}</div>` : (extras.length ? `<div class="stop-tags"><span class="stop-extras">${extras.join(' · ')}</span></div>` : '')}
        ${snip}
      </div>
      <span class="stop-btns">
        <button class="ibtn" data-act="stop-edit" title="编辑/备注" data-day="${day.id}" data-stop="${s.id}">✏️</button>
        <button class="ibtn" data-act="stop-del" title="删除" data-day="${day.id}" data-stop="${s.id}">🗑</button>
      </span></div>`;
  }).join('');

  card.innerHTML = `
    <div class="day-head" style="--c:${color}">
      <div class="day-title-row">
        <span class="day-badge">D${di + 1}</span>
        <input class="day-date" value="${esc(day.date)}" placeholder="日期" data-field="date"/>
        <input class="day-title" value="${esc(day.title)}" placeholder="当日主题" data-field="title"/>
        <button class="ibtn" data-act="del-day" title="删除这一天">🗑</button>
      </div>
      <div class="day-sub-row">
        <label>🌙 宿</label><input class="day-lodge" value="${esc(day.lodging)}" placeholder="住宿地" data-field="lodging"/>
      </div>
      <textarea class="day-note" placeholder="当日贴士 / 避堵策略…">${esc(day.note)}</textarea>
    </div>
    <div class="day-stops">${stopsHtml || '<div class="empty-hint small">这一天还没有停留点：点右上「📍 添加地点」或「📚 地点库」。</div>'}</div>`;
  return card;
};

/* ---------- 面板事件（委托） ---------- */
Panel.bind = function () {
  $('#panel').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const p = currentPlan();
    if (act === 'focus-all') { MV.fitAll(); return; }
    if (act === 'focus-day') { App.ui.activeDayId = btn.dataset.day; MV.focusDay(btn.dataset.day); return; }
    if (act === 'add-day') {
      const d = newDay({ date: '', title: '新的一天' });
      p.days.push(d); App.ui.activeDayId = d.id; App.ui.focusDayId = null;
      requestSave(); Panel.render(); MV.renderAll(); return;
    }
    if (act === 'del-day') {
      const day = p.days.find(d => d.id === btn.dataset.day); if (!day) return;
      confirmDlg('删除行程日', `确定删除「D${p.days.indexOf(day) + 1} ${day.title || day.date || ''}」及其全部停留点？`, '删除').then(ok => {
        if (!ok) return;
        p.days = p.days.filter(d => d !== day);
        if (App.ui.activeDayId === day.id) App.ui.activeDayId = p.days.length ? p.days[0].id : null;
        if (App.ui.focusDayId === day.id) App.ui.focusDayId = null;
        requestSave(); Panel.render(); MV.renderAll();
      });
      return;
    }
    if (act === 'stop-edit') return Panel.openStopEditor(btn.dataset.day, btn.dataset.stop);
    if (act === 'leg-note') return Panel.openLegEditor(btn.dataset.day, btn.dataset.stop);
    if (act === 'leg-draw') return MV.enterDraw(btn.dataset.day, btn.dataset.stop);
    if (act === 'leg-route') return Panel.amapRoute(findStop(btn.dataset.day, btn.dataset.stop));
    if (act === 'stop-del') {
      const f = findStop(btn.dataset.day, btn.dataset.stop); if (!f) return;
      confirmDlg('删除停留点', `确定删除「${f.stop.name}」？`, '删除').then(ok => {
        if (!ok) return;
        f.day.stops.splice(f.index, 1);
        const next = f.day.stops[f.index];
        if (next) next.leg = newLeg({ note: next.leg ? next.leg.note : newNote() });
        requestSave(); Panel.render(); MV.renderAll();
      });
      return;
    }
  });

  // 行程日字段输入
  $('#panel').addEventListener('input', (e) => {
    const inp = e.target.closest('[data-field], .day-note');
    if (!inp) return;
    const dayCard = e.target.closest('.day-card');
    if (!dayCard) return;
    const p = currentPlan();
    const dayEl = $('#day-chips');
    // 找到当前激活 day：以 day-card 对应 activeDayId
    const day = p.days.find(d => d.id === App.ui.activeDayId); if (!day) return;
    if (inp.classList.contains('day-note')) day.note = inp.value;
    else if (inp.dataset.field === 'date') day.date = inp.value;
    else if (inp.dataset.field === 'title') day.title = inp.value;
    else if (inp.dataset.field === 'lodging') day.lodging = inp.value;
    requestSave();
  });
  $('#panel').addEventListener('change', (e) => {
    if (e.target.closest('[data-field]')) { Panel.render(); MV.renderAll(); }
  });

  // 停留点拖拽排序
  let dragId = null;
  $('#panel').addEventListener('dragstart', (e) => {
    const card = e.target.closest('.stop-card'); if (!card) return;
    dragId = card.dataset.stop;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (x) { }
  });
  $('#panel').addEventListener('dragover', (e) => {
    const card = e.target.closest('.stop-card');
    if (card && card.dataset.stop !== dragId) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
  });
  $('#panel').addEventListener('drop', (e) => {
    const card = e.target.closest('.stop-card'); if (!card || !dragId) return;
    e.preventDefault();
    const p = currentPlan();
    const day = p.days.find(d => d.id === card.dataset.day); if (!day) return;
    const from = day.stops.findIndex(s => s.id === dragId);
    const to = day.stops.findIndex(s => s.id === card.dataset.stop);
    if (from < 0 || to < 0 || from === to) return;
    const [moved] = day.stops.splice(from, 1);
    day.stops.splice(to, 0, moved);
    // 受影响的 leg 重置为草稿（保留备注）
    day.stops.forEach((s, i) => {
      if (i === 0) return;
      const prev = day.stops[i - 1];
      const leg = s.leg;
      if (leg && leg.mode !== 'draft' && leg.line) {
        const start = leg.line[0], end = leg.line[leg.line.length - 1];
        if (Math.abs(start[0] - prev.lng) > 1e-6 || Math.abs(start[1] - prev.lat) > 1e-6 ||
            Math.abs(end[0] - s.lng) > 1e-6 || Math.abs(end[1] - s.lat) > 1e-6) {
          leg.mode = 'draft'; leg.line = null; leg.distKm = null; leg.durMin = null;
        }
      }
    });
    dragId = null;
    requestSave(); Panel.render(); MV.renderAll();
  });
};

/* ---------- 添加停留点 ---------- */
Panel.addStopAt = function (latlng) {
  const p = currentPlan();
  let day = p.days.find(d => d.id === App.ui.activeDayId);
  if (!day) { day = newDay({ title: '新的一天' }); p.days.push(day); App.ui.activeDayId = day.id; }
  const w = fromMap(latlng);
  const s = newStop({ lng: w.lng, lat: w.lat });
  if (day.stops.length) s.leg = newLeg();
  day.stops.push(s);
  requestSave(); Panel.render(); MV.renderAll();
  Panel.openStopEditor(day.id, s.id, true);
};

Panel.addStopAfter = function (found) {
  const s = newStop({ lng: (found.prev ? found.stop.lng : found.stop.lng), lat: found.stop.lat });
  s.lng = found.stop.lng; s.lat = found.stop.lat; // 初始位置与锚点重合，稍后拖开或在编辑里改
  if (found.day.stops.length) s.leg = newLeg();
  found.day.stops.splice(found.index + 1, 0, s);
  requestSave(); Panel.render(); MV.renderAll();
  toast('已添加，可拖动标记调整位置');
  Panel.openStopEditor(found.day.id, s.id, true);
};

Panel.amapRoute = async function (found) {
  if (!found || !found.prev) { toast('该点之前没有出发地'); return; }
  if (!App.settings.amapKey) { Panel.openSettings('填写高德 Key 后可用「⚡ 一键算路」'); return; }
  toast('高德算路中…');
  try {
    const r = await amapRouteLeg(found);
    found.stop.leg = found.stop.leg || newLeg();
    found.stop.leg.mode = 'amap';
    found.stop.leg.line = r.line;
    found.stop.leg.distKm = r.distKm;
    found.stop.leg.durMin = r.durMin;
    requestSave(); MV.renderAll(); Panel.render();
    toast(`✓ ${found.prev.name} → ${found.stop.name}：${r.distKm.toFixed(1)} km / 约 ${r.durMin} 分钟`);
  } catch (e) {
    toast(String(e.message || e), 'err');
  }
};

/* ---------- 停留点编辑器 ---------- */
Panel.openStopEditor = function (dayId, stopId, isNew) {
  const f = findStop(dayId, stopId); if (!f) return;
  const s = f.stop;
  const typeOpts = Object.entries(STOP_TYPES).map(([k, v]) => `<option value="${k}" ${s.type === k ? 'selected' : ''}>${v.emoji} ${v.label}</option>`).join('');
  const m = showModal(`
    <h3>${isNew ? '➕ 新增停留点' : '✏️ 编辑停留点'}</h3>
    <div class="modal-body">
      <div class="form-row"><label>名称</label><input id="ed-name" value="${esc(s.name)}"/></div>
      <div class="form-row2">
        <div class="form-row"><label>类型</label><select id="ed-type">${typeOpts}</select></div>
        <div class="form-row"><label>时间备注</label><input id="ed-time" value="${esc(s.time)}" placeholder="如 14:00 / 上午"/></div>
      </div>
      <div class="form-row"><label>坐标</label><div class="coord-line">${s.lat.toFixed(4)}, ${s.lng.toFixed(4)} <span class="hint">可在地图上拖动标记微调</span></div></div>
      ${Panel.noteEditorHtml(s.note, 'stop')}
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" data-x="del">🗑 删除地点</button>
      <span style="flex:1"></span>
      <button class="btn" data-x="cancel">取消</button>
      <button class="btn btn-primary" data-x="save">保存</button>
    </div>`, { wide: true });
  Panel.bindNoteEditor(m, s.note);
  m.querySelector('[data-x="cancel"]').onclick = () => { if (isNew) Panel.removeStopQuiet(f); closeModal(); };
  m.querySelector('[data-x="save"]').onclick = () => {
    s.name = m.querySelector('#ed-name').value.trim() || s.name;
    s.type = m.querySelector('#ed-type').value;
    s.time = m.querySelector('#ed-time').value.trim();
    Panel.saveNoteEditor(m, s.note);
    requestSave(); closeModal(); MV.renderAll(); Panel.render();
  };
  m.querySelector('[data-x="del"]').onclick = async () => {
    if (!await confirmDlg('删除停留点', `确定删除「${s.name}」？`, '删除')) return;
    Panel.removeStopQuiet(f);
    requestSave(); closeModal(); MV.renderAll(); Panel.render();
  };
};

Panel.removeStopQuiet = function (f) {
  f.day.stops = f.day.stops.filter(x => x.id !== f.stop.id);
  const next = f.day.stops[f.index];
  if (next) next.leg = newLeg({ note: next.leg ? next.leg.note : newNote() });
};

/* ---------- 路线段编辑器 ---------- */
Panel.openLegEditor = function (dayId, stopId) {
  const f = findStop(dayId, stopId); if (!f || !f.prev) return;
  const leg = f.stop.leg || newLeg();
  const info = legInfo(f.stop, f.prev, App.settings.speed);
  const modeName = { draft: '草稿直线（估）', manual: '手绘路线', amap: '高德实际路线' }[info.mode];
  const m = showModal(`
    <h3>🛣️ 路线贴士</h3>
    <div class="modal-body">
      <div class="leg-route-line">${esc(f.prev.name)} → ${esc(f.stop.name)}</div>
      <div class="pop-meta">${modeName} · 约 ${info.distKm.toFixed(1)} km · 约 ${Math.round(info.durMin)} 分钟${leg.mode === 'draft' ? '（建议 ⚡ 算路或 🖋️ 手绘后更准）' : ''}</div>
      ${Panel.noteEditorHtml(leg.note, 'leg')}
    </div>
    <div class="modal-foot">
      <span style="flex:1"></span>
      <button class="btn" data-x="cancel">取消</button>
      <button class="btn btn-primary" data-x="save">保存</button>
    </div>`, { wide: true });

/* ---------- 备注编辑器（标签/文本/链接/图片） ---------- */
Panel.noteEditorHtml = function (note, kind) {
  const tagChips = NOTE_TAGS.map(t => `<button type="button" class="tag-chip ${(note.tags || []).includes(t) ? 'on' : ''}" data-tag="${t}">${t}</button>`).join('');
  return `
    <div class="form-row"><label>标签</label><div class="tag-row" data-kind="${kind}">${tagChips}</div></div>
    <div class="form-row"><label>笔记 / 贴士 / log</label><textarea class="ed-text" rows="3" placeholder="记录备注、提醒、攻略摘要…"></textarea></div>
    <div class="form-row"><label>链接</label>
      <div class="links-box"></div>
      <button type="button" class="btn btn-xs" data-x="add-link">＋ 添加链接</button>
    </div>
    <div class="form-row"><label>图片</label>
      <div class="imgs-box"></div>
      <div class="img-actions">
        <label class="btn btn-xs file-label">📁 上传图片<input type="file" accept="image/*" multiple hidden class="ed-imgfile"/></label>
        <input class="ed-imgurl" placeholder="或粘贴图片链接 https://…"/>
        <button type="button" class="btn btn-xs" data-x="add-imgurl">添加</button>
      </div>
    </div>`;
};

Panel.bindNoteEditor = function (m, note) {
  m.querySelector('.ed-text').value = note.text || '';
  m.querySelector('.tag-row').addEventListener('click', (e) => {
    const c = e.target.closest('.tag-chip'); if (!c) return;
    c.classList.toggle('on');
  });
  const linksBox = m.querySelector('.links-box');
  const renderLinks = () => {
    linksBox.innerHTML = (note.links || []).map((l, i) => `
      <div class="link-row" data-i="${i}">
        <input class="lk-title" placeholder="标题" value="${esc(l.title)}"/>
        <input class="lk-url" placeholder="https://…" value="${esc(l.url)}"/>
        <button type="button" class="ibtn" data-del-link="${i}">✕</button>
      </div>`).join('') || '<div class="hint">暂无链接</div>';
  };
  renderLinks();
  linksBox.addEventListener('click', (e) => {
    const d = e.target.closest('[data-del-link]');
    if (d) { note.links.splice(+d.dataset.delLink, 1); renderLinks(); }
  });
  m.querySelector('[data-x="add-link"]').onclick = () => { note.links = note.links || []; note.links.push({ title: '', url: '' }); renderLinks(); };

  const imgsBox = m.querySelector('.imgs-box');
  const renderImgs = async () => {
    imgsBox.innerHTML = (note.images || []).map((im, i) => `<div class="img-thumb" data-i="${i}"><img/><button type="button" class="img-del" data-del-img="${i}">✕</button></div>`).join('');
    for (const [i, im] of (note.images || []).entries()) {
      const url = await imgURL(im);
      const el = imgsBox.querySelector(`.img-thumb[data-i="${i}"] img`);
      if (el && url) el.src = url;
    }
    if (!(note.images || []).length) imgsBox.innerHTML = '<div class="hint">暂无图片（海报不使用照片，仅备注内查看）</div>';
  };
  renderImgs();
  imgsBox.addEventListener('click', (e) => {
    const d = e.target.closest('[data-del-img]');
    if (d) {
      const im = note.images[+d.dataset.delImg];
      if (im && im.kind === 'idb') ImgDB.del(im.id);
      note.images.splice(+d.dataset.delImg, 1);
      renderImgs();
    }
  });
  m.querySelector('.ed-imgfile').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    if (!('indexedDB' in window)) { toast('当前环境不支持本地图片库，请改用图片链接', 'err'); return; }
    for (const file of files) {
      try { await addImageToNote(note, file); } catch (err) { toast('图片处理失败：' + file.name, 'err'); }
    }
    renderImgs();
    e.target.value = '';
  });

/* ============ 分享海报（Canvas 纯矢量渲染）+ 打印导出 ============ */
'use strict';

const Poster = {
  orientation: 'portrait',   // portrait | landscape
  lastCanvas: null,
  prefs: null,               // { labels: bool, range: 'island'|'trip' }
};

const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';

/* ---------- 海报显示偏好（localStorage 持久化，读写均容错） ---------- */
const POSTER_PREFS_KEY = 'hainanTrip.posterPrefs';
function loadPosterPrefs() {
  const def = { labels: true, range: 'island' };
  try {
    const d = JSON.parse(localStorage.getItem(POSTER_PREFS_KEY));
    if (!d || typeof d !== 'object') return def;
    return {
      labels: typeof d.labels === 'boolean' ? d.labels : def.labels,
      range: d.range === 'trip' ? 'trip' : 'island',
    };
  } catch (e) { return def; }
}
function savePosterPrefs() {
  try { localStorage.setItem(POSTER_PREFS_KEY, JSON.stringify(Poster.prefs)); } catch (e) { /* ignore */ }
}
Poster.prefs = loadPosterPrefs();

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function halo(ctx, text, x, y, fill, strokeW) {
  ctx.save();
  ctx.lineWidth = strokeW || 4; ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
  ctx.restore();
}
function waves(ctx, W, H, cx, cy, baseR, n, gap) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  for (let i = 0; i < n; i++) {
    ctx.beginPath();
    ctx.lineWidth = 3;
    ctx.arc(cx, cy, baseR + i * gap, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }
  ctx.restore();
}

function collectRoutes(plan) {
  // 返回 {days:[{color, label, lodging, segments:[[ [lng,lat],... ]], stops:[{name,lng,lat,num,type}]}], totalNum}
  const days = [];
  let n = 0;
  plan.days.forEach((d, di) => {
    const day = {
      color: DAY_COLORS[di % DAY_COLORS.length],
      label: `D${di + 1}`, date: d.date, title: d.title, lodging: d.lodging,
      segments: [], stops: [],
    };
    d.stops.forEach((s, i) => {
      n++;
      day.stops.push({ name: s.name, lng: s.lng, lat: s.lat, num: n, type: s.type });
      if (i > 0) {
        const leg = s.leg;
        let line;
        if (leg && leg.mode !== 'draft' && leg.line && leg.line.length > 1) line = leg.line;
        else line = legDraftLine(d.stops[i - 1], s);
        day.segments.push(line);
      }
    });
    days.push(day);
  });
  return { days, totalNum: n };
}

function islandBBox() {
  let minX = 999, minY = 999, maxX = -999, maxY = -999;
  const walk = (c) => { if (typeof c[0] === 'number') { minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]); minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]); } else c.forEach(walk); };
  const feats = (window.HAINAN_GEO && HAINAN_GEO.features || []).filter(f => !(((f.properties || {}).name) || '').includes('三沙'));
  walk(feats.map(f => f.geometry.coordinates));
  return { minX, minY, maxX, maxY };
}

/* 当前方案全部停留点的 bbox：四边外扩 8%，跨度不足 0.05° 时取最小跨度（防单点/近距点群夸张放大） */
function tripBBox(plan) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  collectRoutes(plan).days.forEach(d => d.stops.forEach(s => {
    if (s.lng < minX) minX = s.lng; if (s.lng > maxX) maxX = s.lng;
    if (s.lat < minY) minY = s.lat; if (s.lat > maxY) maxY = s.lat;
  }));
  if (!isFinite(minX)) return islandBBox();
  const MIN_SPAN = 0.05;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  let sx = Math.max(maxX - minX, MIN_SPAN) * 1.16;
  let sy = Math.max(maxY - minY, MIN_SPAN) * 1.16;
  return { minX: cx - sx / 2, minY: cy - sy / 2, maxX: cx + sx / 2, maxY: cy + sy / 2 };
}

/* 在矩形内绘制地图面板，返回投影函数。
   opts.bounds: 自定义投影范围（WGS-84 bbox，缺省为全岛）；opts.labels: 是否绘制站点名称（缺省 true） */
function drawMapPanel(ctx, plan, rect, opts) {
  opts = opts || {};
  const { x, y, w, h } = rect;
  const pad = Math.round(w * 0.055);
  // 投影（等经纬 + 纬度余弦修正）——先于任何绘制，避免 TDZ 引用错误
  const bb = opts.bounds || islandBBox();
  const midLat = (bb.minY + bb.maxY) / 2;
  const dLng = (bb.maxX - bb.minX) * Math.cos(midLat * Math.PI / 180);
  const dLat = (bb.maxY - bb.minY);
  const k = Math.min((w - pad * 2) / dLng, (h - pad * 2) / dLat);
  const ox = x + (w - dLng * k) / 2, oy = y + (h - dLat * k) / 2;
  function proj(lng, lat) {
    if (lng == null) lng = bb.minX;
    if (lat == null) lat = bb.minY;
    return { X: ox + (lng - bb.minX) * Math.cos(midLat * Math.PI / 180) * k, Y: oy + (bb.maxY - lat) * k };
  }
  const P = (lng, lat) => { const p = proj(lng, lat); return [p.X, p.Y]; };

  ctx.save();
  // 面板纸面 + 阴影
  ctx.save();
  ctx.shadowColor = 'rgba(4,36,48,0.45)';
  ctx.shadowBlur = 34; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#F3EDDE';
  rr(ctx, x, y, w, h, 26); ctx.fill();
  ctx.restore();
  rr(ctx, x, y, w, h, 26); ctx.clip();

  // 经纬淡网格
  ctx.strokeStyle = 'rgba(140,120,80,0.10)'; ctx.lineWidth = 1;
  for (let g = 108.5; g <= 111.1; g += 0.5) {
    const px = proj(g, null).X;
    ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px, y + h); ctx.stroke();
  }
  for (let g = 18.0; g <= 20.2; g += 0.5) {
    const py = proj(null, g).Y;
    ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(x + w, py); ctx.stroke();
  }

  // 岛屿：白色填充
  ctx.fillStyle = '#FFFFFF';
  HAINAN_GEO.features.forEach(f => {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [];
    polys.forEach(poly => {
      ctx.beginPath();
      poly.forEach((ring, ri) => {
        ring.forEach((c, i) => { const [px, py] = P(c[0], c[1]); i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); });
        ctx.closePath();
      });
      ctx.fill('evenodd');
    });
  });
  // 市县虚界（白色托底 + 沙色虚线）
  const strokeCounties = (dash, color, lw) => {
    ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = lw;
    HAINAN_GEO.features.forEach(f => {
      const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [];
      polys.forEach(poly => poly.forEach(ring => {
        ctx.beginPath();
        ring.forEach((c, i) => { const [px, py] = P(c[0], c[1]); i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); });
        ctx.stroke();
      }));
    });
    ctx.setLineDash([]);
  };
  if (window.HAINAN_ROADS) {
    const drawRoads = (arr, color, lw) => {
      ctx.strokeStyle = color; ctx.lineWidth = lw;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      (arr || []).forEach(line => {
        ctx.beginPath();
        line.forEach((c, i) => { const [px, py] = P(c[0], c[1]); i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); });
        ctx.stroke();
      });
    };
    drawRoads(HAINAN_ROADS.e, '#C4B79A', 2.6);
    drawRoads(HAINAN_ROADS.p, '#D3CBB4', 1.4);
  }
  strokeCounties([5, 4], 'rgba(150,130,90,0.30)', 1.3);

  // 路线（白托底 + 日色主线）
  const data = collectRoutes(plan);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  data.days.forEach(day => {
    day.segments.forEach(line => {
      const pts = line.map(c => P(c[0], c[1]));
      if (pts.length < 2) return;
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 9;
      ctx.beginPath(); pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])); ctx.stroke();
      ctx.strokeStyle = day.color; ctx.lineWidth = 4.6;
      ctx.beginPath(); pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])); ctx.stroke();
    });
  });
  // 站点徽章 + 名称
  data.days.forEach(day => {
    day.stops.forEach((s, si) => {
      const [px, py] = P(s.lng, s.lat);
      ctx.beginPath(); ctx.arc(px, py, 13.5, 0, Math.PI * 2);
      ctx.fillStyle = day.color; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `700 15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(s.num), px, py + 0.5);
      if (opts.labels !== false) {
        const right = px < x + w * 0.72;
        ctx.font = `600 17px ${FONT}`;
        ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle';
        const tx = right ? px + 21 : px - 21;
        const ty = py + (s.num % 2 === 0 ? -18 : 18);
        halo(ctx, s.name, tx, ty, '#4A5A60', 4);
        ctx.textAlign = 'center';
      }
    });
  });
  // 指北针 + 图例
  const cx = x + w - 52, cy = y + 56;
  ctx.strokeStyle = '#8B7B5E'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + 12); ctx.lineTo(cx - 7, cy + 6); ctx.lineTo(cx, cy - 14); ctx.lineTo(cx + 7, cy + 6); ctx.closePath();
  ctx.fillStyle = '#8B7B5E'; ctx.fill();
  ctx.font = `700 12px ${FONT}`; ctx.fillStyle = '#8B7B5E';
  ctx.fillText('N', cx, cy - 28);
  ctx.restore();
  return proj;
}

function headerMetrics(ctx, plan, boxW, topY, size) {
  let ts = size || 60;
  ctx.font = `900 ${ts}px ${FONT}`;
  const title = plan.name || '海南自驾行程';
  while (ctx.measureText(title).width > boxW - 120 && ts > 30) { ts -= 2; ctx.font = `900 ${ts}px ${FONT}`; }
  const th = Math.round((size || 60) * 0.72);
  return { ts, th, subY: topY + th + ts + 14 + Math.round(ts * 0.75) };
}

function posterHeader(ctx, plan, centerX, boxW, topY, size) {
  const hm = headerMetrics(ctx, plan, boxW, topY, size);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // 顶部小徽标
  const tag = '海南自驾 · 行程路书';
  ctx.font = `500 ${Math.round(hm.ts * 0.36)}px ${FONT}`;
  const tw = ctx.measureText(tag).width + 44;
  const th = hm.th;
  const tx = centerX - tw / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  rr(ctx, tx, topY, tw, th, th / 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.textBaseline = 'middle';
  ctx.fillText(tag, centerX, topY + th / 2 + 1);
  // 主标题
  ctx.font = `900 ${hm.ts}px ${FONT}`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,40,60,0.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillText(plan.name || '海南自驾行程', centerX, topY + th + hm.ts + 14);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  // 副标题
  const st = planStats(plan);
  const sub = [plan.startDate && plan.endDate ? `${plan.startDate} – ${plan.endDate}` : '', `${plan.days.length} 天${st.stops ? ` ${st.stops} 站` : ''}`, plan.travelers, plan.vehicle].filter(Boolean).join(' · ');
  ctx.font = `400 ${Math.round(hm.ts * 0.46)}px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fillText(sub, centerX, hm.subY);
  return hm.subY;
}

function circledNum(n) { return n <= 20 ? String.fromCodePoint(0x2460 + n - 1) : '(' + n + ')'; }

const NO_BREAK_BEFORE = '）】」』！？。，、；：…';
function wrapText(ctx, text, maxW) {
  const lines = []; let line = '';
  for (const ch of Array.from(text)) {
    // 标点悬挂：不允许"）"这类标点单独落到行首
    if (line && ctx.measureText(line + ch).width > maxW && !NO_BREAK_BEFORE.includes(ch)) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

/* 逐日行程行（日期标题 + 实际路线序列 + 住宿）；draw=false 时仅测量高度 */
function dayList(ctx, plan, x, y, maxW, draw) {
  const data = collectRoutes(plan);
  const lhTitle = 36, lhRoute = 30, dayGap = 20;
  let cy = y;
  data.days.forEach((day, di) => {
    const titleText = `D${di + 1}  ${day.date || ''}  ${day.title || ''}`.trim();
    if (draw) {
      ctx.beginPath(); ctx.arc(x + 9, cy + lhTitle / 2 - 5, 8, 0, Math.PI * 2);
      ctx.fillStyle = day.color; ctx.fill();
      ctx.font = `700 26px ${FONT}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(titleText, x + 26, cy + lhTitle / 2 - 5);
      if (day.lodging) {
        ctx.font = `500 21px ${FONT}`;
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillText('🌙 宿 ' + day.lodging, x + maxW, cy + lhTitle / 2 - 5);
        ctx.textAlign = 'left';
      }
    }
    cy += lhTitle - 8;
    const routeText = day.stops.length
      ? day.stops.map(s => `${circledNum(s.num)}${s.name}`).join('  →  ')
      : '—（暂无停留点）';
    ctx.font = `400 21px ${FONT}`;
    const lines = wrapText(ctx, routeText, maxW - 26);
    lines.forEach(ln => {
      if (draw) {
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.textBaseline = 'middle';
        ctx.fillText(ln, x + 26, cy + lhRoute / 2 - 4);
      }
      cy += lhRoute;
    });
    cy += dayGap;
  });
  return data.days.length ? cy - y - dayGap : 0;
}

function scratchCtx() {
  return document.createElement('canvas').getContext('2d');
}

function renderPoster(plan, orientation, scale) {
  const portrait = orientation !== 'landscape';
  const W = portrait ? 1080 : 1920;
  const mc = scratchCtx();
  const mapOpts = {
    labels: !(Poster.prefs && Poster.prefs.labels === false),
    bounds: Poster.prefs && Poster.prefs.range === 'trip' ? tripBBox(plan) : null,
  };

  // ---- 先排版度量，得出自适应高度（宽度固定，高度随内容伸展） ----
  let hm, listH, H;
  if (portrait) {
    hm = headerMetrics(mc, plan, W, 54, 62);
    listH = dayList(mc, plan, 0, 0, W - 128, false);
    H = Math.max(1800, Math.ceil(hm.subY + 34 + 1000 + 34 + listH + 30 + 58 + 92));
  } else {
    hm = headerMetrics(mc, plan, 614, 46, 54);
    listH = dayList(mc, plan, 0, 0, 614, false);
    H = Math.max(1080, Math.ceil(hm.subY + 26 + listH + 30 + 170 + 70));
  }
  const canvas = document.createElement('canvas');
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // 海洋渐变背景
  const g = ctx.createLinearGradient(0, 0, portrait ? 0 : W, portrait ? H : 0);
  g.addColorStop(0, '#094A5E'); g.addColorStop(0.55, '#0E6E86'); g.addColorStop(1, '#159BB4');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  waves(ctx, W, H, W - 40, H - 60, 60, 5, 26);
  waves(ctx, W, H, 60, 120, 46, 4, 22);

  const st = planStats(plan);
  if (portrait) {
    posterHeader(ctx, plan, W / 2, W, 54, 62);
    const mapRect = { x: 56, y: hm.subY + 34, w: W - 112, h: 1000 };
    drawMapPanel(ctx, plan, mapRect, mapOpts);
    const listY = mapRect.y + mapRect.h + 34;
    dayList(ctx, plan, 64, listY, W - 128, true);
    const stats = `🛣️ 全程约 ${st.km} km　·　📍 ${st.stops} 个停留点　·　🏛️ 途经 ${st.counties} 市县`;
    ctx.font = `600 28px ${FONT}`;
    const sw = ctx.measureText(stats).width + 90;
    const sy = listY + listH + 30;
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    rr(ctx, W / 2 - sw / 2, sy, sw, 58, 29); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(stats, W / 2, sy + 30);
    ctx.font = `400 21px ${FONT}`;
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    ctx.fillText('海南自驾行程规划 · 本地生成', W / 2, H - 52);
  } else {
    const rx = 1250, rw = W - rx - 56;
    const mapRect = { x: 56, y: 56, w: 1130, h: H - 112 };
    drawMapPanel(ctx, plan, mapRect, mapOpts);
    posterHeader(ctx, plan, rx + rw / 2, rw, 46, 54);
    const listY = hm.subY + 26;
    dayList(ctx, plan, rx, listY, rw, true);
    let sy = listY + listH + 30;
    const statsLines = [
      `🛣️ 全程约 ${st.km} km`,
      `📍 ${st.stops} 个停留点 · 🏛️ 途经 ${st.counties} 市县`,
    ];
    statsLines.forEach(t => {
      ctx.font = `600 27px ${FONT}`;
      const sw2 = ctx.measureText(t).width + 70;
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      rr(ctx, rx, sy, sw2, 54, 27); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(t, rx + 35, sy + 28);
      sy += 66;
    });
    ctx.font = `400 21px ${FONT}`;
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    ctx.fillText('海南自驾行程规划 · 本地生成', rx, H - 60);
    ctx.textAlign = 'left';
  }
  return canvas;
}

/* ---------- 海报弹窗 ---------- */
Poster.openModal = function () {
  const plan = currentPlan(); if (!plan) return;
  const m = showModal(`
    <h3>🖼️ 分享海报 <span class="hint">纯矢量绘制，自动按当前方案生成；导出 PNG 高清图</span></h3>
    <div class="modal-body poster-body">
      <div class="poster-toolbar">
        <div class="seg">
          <button class="btn btn-xs ${Poster.orientation === 'portrait' ? 'btn-primary' : ''}" data-o="portrait">竖版 · 朋友圈</button>
          <button class="btn btn-xs ${Poster.orientation === 'landscape' ? 'btn-primary' : ''}" data-o="landscape">横版 · 打印/电脑</button>
        </div>
        <div class="seg">
          <button class="btn btn-xs" data-labels="1" title="地图上绘制站点名称文字（可能重叠）">🏷️ 名称标注</button>
          <button class="btn btn-xs" data-labels="0" title="只显示编号徽章，不显示名称文字">🔢 仅编号</button>
        </div>
        <div class="seg">
          <button class="btn btn-xs" data-range="island" title="地图范围为海南全岛">🗺️ 全岛</button>
          <button class="btn btn-xs" data-range="trip" title="自动缩放到本次行程的停留点范围">📌 行程</button>
        </div>
        <button class="btn btn-primary" data-x="download">⬇️ 下载高清 PNG</button>
      </div>
      <div class="poster-preview-wrap"><canvas id="poster-canvas"></canvas></div>
    </div>`, { wide: true });
  const canvas = m.querySelector('#poster-canvas');
  const render = () => {
    const scale = Poster.orientation === 'portrait' ? 1.2 : 1.5;
    const c = renderPoster(plan, Poster.orientation, scale);
    canvas.width = c.width; canvas.height = c.height;
    canvas.getContext('2d').drawImage(c, 0, 0);
    canvas.style.aspectRatio = `${c.width}/${c.height}`;
  };
  const syncSegs = () => {
    $$('[data-o]', m).forEach(b => b.classList.toggle('btn-primary', b.dataset.o === Poster.orientation));
    $$('[data-labels]', m).forEach(b => b.classList.toggle('btn-primary', (b.dataset.labels === '1') === !!Poster.prefs.labels));
    $$('[data-range]', m).forEach(b => b.classList.toggle('btn-primary', b.dataset.range === Poster.prefs.range));
  };
  syncSegs();
  render();
  m.querySelector('.poster-toolbar').addEventListener('click', (e) => {
    const ob = e.target.closest('[data-o]');
    if (ob) { Poster.orientation = ob.dataset.o; syncSegs(); render(); return; }
    const lb = e.target.closest('[data-labels]');
    if (lb) { Poster.prefs.labels = lb.dataset.labels === '1'; savePosterPrefs(); syncSegs(); render(); return; }
    const rb = e.target.closest('[data-range]');
    if (rb) { Poster.prefs.range = rb.dataset.range; savePosterPrefs(); syncSegs(); render(); }
  });
  m.querySelector('[data-x="download"]').onclick = () => {
    toast('生成高清图…');
    setTimeout(() => {
      const c = renderPoster(plan, Poster.orientation, 2);
      c.toBlob(blob => {
        const safeName = (plan.name || '行程').replace(/[\\/:*?"<>|]/g, '_');
        downloadFile(`海南自驾-${safeName}-${Poster.orientation === 'portrait' ? '竖版' : '横版'}.png`, blob);
        toast('已保存海报 PNG');
      }, 'image/png');
    }, 30);
  };
};

/* ---------- 打印 / PDF ---------- */
Poster.print = function () {
  const plan = currentPlan(); if (!plan) return;
  const root = $('#print-root');
  const c = renderPoster(plan, 'landscape', 1.2);
  const st = planStats(plan);
  let html = `<div class="pr-head"><h1>${esc(plan.name)}</h1><div class="pr-sub">${esc([plan.startDate && plan.endDate ? `${plan.startDate} – ${plan.endDate}` : '', plan.travelers, plan.vehicle].filter(Boolean).join(' · '))} · 全程约 ${st.km} km</div></div>`;
  html += `<img class="pr-poster" src="${c.toDataURL('image/png')}"/>`;
  html += `<div class="pr-days">`;
  plan.days.forEach((d, di) => {
    const color = DAY_COLORS[di % DAY_COLORS.length];
    html += `<section class="pr-day"><h2 style="border-color:${color}">D${di + 1} ${esc(d.date || '')} ${esc(d.title || '')}${d.lodging ? ` <span class="pr-lodge">🌙 宿 ${esc(d.lodging)}</span>` : ''}</h2>`;
    if (d.note) html += `<p class="pr-daynote">💡 ${esc(d.note)}</p>`;
    if (!d.stops.length) html += `<p class="hint">（无停留点）</p>`;
    d.stops.forEach((s, i) => {
      if (i > 0 && d.stops[i - 1]) {
        const info = legInfo(s, d.stops[i - 1], App.settings.speed);
        const legNote = s.leg && s.leg.note;
        html += `<div class="pr-leg">🛣️ ${esc(d.stops[i - 1].name)} → ${esc(s.name)} · ${info.distKm.toFixed(1)} km · ~${Math.round(info.durMin)} 分钟${legNote && legNote.text ? ` —— ${esc(legNote.text)}` : ''}${legNote && legNote.tags && legNote.tags.length ? `（${esc(legNote.tags.join('、'))}）` : ''}</div>`;
      }
      const t = STOP_TYPES[s.type] || STOP_TYPES.other;
      html += `<div class="pr-stop"><span class="pr-stopname">${t.emoji} ${esc(s.name)}${s.time ? ` <span class="pr-time">${esc(s.time)}</span>` : ''}</span>`;
      if (s.note.tags && s.note.tags.length) html += `<span class="pr-tags">${s.note.tags.map(x => esc(x)).join(' / ')}</span>`;
      if (s.note.text) html += `<div class="pr-notetext">${esc(s.note.text)}</div>`;
      if (s.note.links && s.note.links.length) html += `<div class="pr-links">${s.note.links.map(l => `🔗 <span>${esc(l.title)}</span>：${esc(l.url)}`).join('<br>')}</div>`;
      html += `</div>`;
    });
    html += `</section>`;
  });
  html += `</div><div class="pr-foot">海南自驾行程规划 · 打印于 ${new Date().toLocaleString('zh-CN')}</div>`;
  root.innerHTML = html;
  setTimeout(() => window.print(), 60);
};


/* ============ 启动与全局事件 ============ */
'use strict';

(function boot() {
  loadState();
  MV.init();
  Panel.bind();
  Panel.render();
  MV.renderAll();
  MV.map.fitBounds(MV.islandBounds, { padding: [30, 30] });

  // 顶栏按钮
  $('#btn-plans').addEventListener('click', () => Panel.openPlans());
  $('#btn-poster').addEventListener('click', () => Poster.openModal());
  $('#btn-print').addEventListener('click', () => Poster.print());
  $('#btn-settings').addEventListener('click', () => Panel.openSettings());
  $('#btn-help').addEventListener('click', () => Panel.openHelp());

  // 地图工具
  $('#btn-add-stop').addEventListener('click', () => MV.toggleAddMode());
  $('#btn-add-poi').addEventListener('click', () => Panel.openPoiLib());
  $('#basemap-switcher').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-bm]');
    if (b) MV.setBasemap(b.dataset.bm);
  });
  // 手绘工具条
  $('#draw-undo').addEventListener('click', () => {
    if (!MV.draw) return;
    MV.draw.pts.pop();
    MV.renderDrawPreview();
  });
  $('#draw-done').addEventListener('click', () => MV.finishDraw());
  $('#draw-cancel').addEventListener('click', () => { MV.exitDraw(); MV.renderAll(); });

  window.addEventListener('beforeprint', () => { if (!$('#print-root').innerHTML) Poster.print && null; });

  // 首次使用引导
  let seen = false;
  try { seen = !!localStorage.getItem('hainanTrip.introSeen'); } catch (e) { }
  if (!seen) {
    Panel.openHelp();
    try { localStorage.setItem('hainanTrip.introSeen', '1'); } catch (e) { }
  }
})();
